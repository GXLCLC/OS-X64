# =============================================================================
# build-lede.yml —— LEDE（coolsnowwolf/lede）X86_64 云编译工作流
#
# 触发方式：仅 workflow_dispatch 手动触发（用户规范：关闭所有自动触发，
#           仓库主页 Actions -> 本工作流 -> Run workflow）
# 运行环境：ubuntu-24.04（Ubuntu 24.04 LTS）
# 源码    ：固定拉取 coolsnowwolf/lede master 分支（浅克隆）
# 目标    ：仅 X86_64 Generic + squashfs（config/X86_64.config）
# 时区    ：Asia/Shanghai（全流程固定）
#
# 流程总览：
#   环境准备 -> 克隆 LEDE -> feeds -> 第三方插件 -> TurboAcc -> 个性化
#   -> 写入 .config -> defconfig -> 清单校验(config) -> DL 下载(缓存)
#   -> 严格编译 -> 镜像校验 -> gzip(时间前缀) -> Release 说明 -> 发布
#   任一步骤失败：自动收集 ERROR 失败日志并上传工件（仅失败时上传）
# =============================================================================
name: LEDE X86_64 云编译

# 仅手动触发（用户规范）
on:
  workflow_dispatch:

permissions:
  contents: write        # 创建 Release 与上传附件所需

env:
  TZ: Asia/Shanghai      # 全流程固定时区（用户规范）
  LEDE_REPO: https://github.com/coolsnowwolf/lede
  LEDE_BRANCH: master    # 固定 master 分支（用户规范）
  LEDE_DIR: lede         # LEDE 源码检出目录（工作区下的子目录）
  # 个性化默认值（用户规范：默认 IP 192.168.2.1、密码 12345678）
  LAN_IP: 192.168.2.1
  ROOT_PASSWORD: '12345678'
  HOSTNAME: LEDE-X64

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360  # x86_64 全量编译（内核+插件）约 1.5~3 小时，给足上限

    steps:
      # ---- 1. 检出本仓库（scripts/ 与 config/） --------------------------------
      - name: 检出编译仓库（脚本与配置）
        uses: actions/checkout@v4

      # ---- 2. 释放 runner 磁盘空间 -------------------------------------------
      # x86_64 全量编译（工具链+内核+插件+dl）约需 15~25 GB，
      # 预先移除 runner 预装的大件（.NET/Android/GHC/Boost），避免中途磁盘不足。
      - name: 释放磁盘空间（移除 runner 预装大件）
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost || true
          df -h /

      # ---- 3. 安装编译依赖（Ubuntu 24.04 LTS） --------------------------------
      # OpenWrt 官方构建依赖（Ubuntu 24.04 兼容清单）+ squashfs-tools（镜像深检
      # unsquashfs 需要）+ libelf-dev（内核模块编译需要）+ time（构建计时）。
      # 注意：24.04 已无 python3-distutils（PEP 632 移除）与 libncurses5-dev
      # （并入 libncurses-dev），误用将导致 apt 直接失败。
      - name: 安装编译依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools \
            rsync swig unzip zlib1g-dev file wget time \
            squashfs-tools libelf-dev
          echo "依赖安装完成"

      # ---- 4. 浅克隆 LEDE 源码（master 分支） ---------------------------------
      # 用户规范：固定拉取 LEDE master；浅克隆加速（历史对本场景无用）
      - name: 克隆 LEDE 源码（master，浅克隆）
        run: |
          git clone --depth=1 --branch "${LEDE_BRANCH}" "${LEDE_REPO}" "${LEDE_DIR}"
          echo "LEDE 版本信息："
          git -C "${LEDE_DIR}" log -1 --format='commit %h %ci %s'

      # ---- 5. 恢复 DL 下载缓存（用户规范：开 DL 缓存） -------------------------
      # 首次运行无缓存（完整下载）；之后每次运行自动恢复上次的 dl/ 目录，
      # 作业结束时 actions/cache 自动保存最新缓存（restore-keys 兜底任意旧缓存）。
      - name: 恢复 DL 缓存（编译依赖下载）
        uses: actions/cache@v4
        with:
          path: ${{ env.LEDE_DIR }}/dl
          key: ${{ runner.os }}-lede-dl-${{ hashFiles('lede/include/version.mk') }}
          restore-keys: |
            ${{ runner.os }}-lede-dl-

      # ---- 6. 更新并安装 feeds -------------------------------------------------
      # feeds install 会在 package/feeds/ 生成各 feed 的符号链接，
      # 后续第三方脚本据此判断「官方是否已提供某包」（优先官方源码包原则）。
      - name: 更新并安装 feeds
        working-directory: ${{ env.LEDE_DIR }}
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "feeds 安装完成"

      # ---- 7. 第三方插件稀疏检出（ddnsto + OAF，前置校验） --------------------
      # 拉取规范：浅克隆+部分克隆+稀疏检出；仓库连通性/分支/目录/依赖强制校验，
      # 异常立即终止并输出修复建议。
      - name: 拉取第三方插件（稀疏检出 + 前置校验）
        working-directory: ${{ env.LEDE_DIR }}
        env:
          LEDE_DIR: ${{ github.workspace }}/${{ env.LEDE_DIR }}
        run: bash "${GITHUB_WORKSPACE}/scripts/fetch-thirdparty.sh"

      # ---- 8. 集成 TurboAcc（仅补 LuCI 应用，内核层全官方） -------------------
      # LEDE 官方已集成 TurboAcc 内核层与 FullCone 网络栈（hack-6.18 +
      # fullconenat-nft + nftables/libnftnl/firewall4 补丁）；
      # 仅从 mufeng05/turboacc 取含 FULLCONE 选项的 LuCI 应用并覆盖官方旧版。
      - name: 集成 TurboAcc（流量分载 + 全锥形 NAT + BBR）
        working-directory: ${{ env.LEDE_DIR }}
        env:
          LEDE_DIR: ${{ github.workspace }}/${{ env.LEDE_DIR }}
        run: bash "${GITHUB_WORKSPACE}/scripts/apply-turboacc.sh"

      # ---- 9. 个性化（默认 IP/密码/主机名/主题/防火墙 + 源码级密码替换） --------
      - name: 固件个性化（IP 192.168.2.1 / 密码 / Argon 主题）
        working-directory: ${{ env.LEDE_DIR }}
        run: |
          bash "${GITHUB_WORKSPACE}/scripts/personalize.sh" \
            "${GITHUB_WORKSPACE}/${LEDE_DIR}" "${LAN_IP}" "${ROOT_PASSWORD}" "${HOSTNAME}"

      # ---- 10. 写入编译配置 ----------------------------------------------------
      # config/X86_64.config 为本仓库唯一配置源（增删插件改它），
      # 拷入源码树 .config 后由 make defconfig 补全默认项。
      - name: 写入编译配置（X86_64Generic + squashfs）
        working-directory: ${{ env.LEDE_DIR }}
        run: |
          cp -f "${GITHUB_WORKSPACE}/config/X86_64.config" .config
          echo "已写入 .config（$(grep -c '=y' .config) 个启用项）"

      # ---- 11. defconfig 补全默认项 -------------------------------------------
      - name: 生成完整配置（make defconfig）
        working-directory: ${{ env.LEDE_DIR }}
        run: make defconfig

      # ---- 12. 清单校验（config 模式，基于最终 .config） ----------------------
      # 在最终 .config 上校验 15 插件 + 核心 + 驱动 + TurboAcc 开关全部就位，
      # 提前拦截配置笔误 / feed 结构调整导致的符号丢失。
      - name: 插件清单校验（config 模式）
        working-directory: ${{ env.LEDE_DIR }}
        run: bash "${GITHUB_WORKSPACE}/scripts/check-packages.sh" config .config

      # ---- 13. 预下载全部依赖 ------------------------------------------------
      # 严格模式：下载失败即终止；与 DL 缓存配合，二次构建秒过。
      - name: 预下载编译依赖（make download）
        working-directory: ${{ env.LEDE_DIR }}
        run: |
          set -o pipefail
          make download -j"$(nproc)" 2>&1 | tail -n 50

      # ---- 14. 严格编译 --------------------------------------------------------
      # 严格编译模式：任何错误立即终止（不忽略错误、不 -k 续跑）；
      # 全程输出重定向至 build.log，供失败时收集 ERROR 日志。
      - name: 编译固件（严格模式）
        working-directory: ${{ env.LEDE_DIR }}
        id: compile
        run: |
          set -o pipefail
          make -j"$(nproc)" 2>&1 | tee build.log
          echo "编译完成，镜像目录：bin/targets/x86/64"

      # ---- 15. 镜像校验（文件/格式/分区容量/squashfs/manifest） ----------------
      # 用户规范：编译后校验文件/格式/分区容量，不达标终止；未生成目标镜像判定失败。
      - name: 镜像校验（文件 / 格式 / 分区容量 / 插件清单）
        working-directory: ${{ env.LEDE_DIR }}
        run: |
          bash "${GITHUB_WORKSPACE}/scripts/verify-artifacts.sh" \
            "${GITHUB_WORKSPACE}/${LEDE_DIR}/bin/targets/x86/64" \
            "${GITHUB_WORKSPACE}/config/X86_64.config"

      # ---- 16. gzip 压缩（时间前缀命名） --------------------------------------
      # combined.img ≈ 2112 MiB 超 GitHub Release 单文件 2 GiB 上限，
      # 故构建时关闭内置 gzip，此处校验通过后手动 gzip -9 并加时间前缀。
      - name: 压缩镜像（gzip -9，时间前缀命名）
        working-directory: ${{ env.LEDE_DIR }}/bin/targets/x86/64
        id: gzip
        run: |
          TIME_TAG="$(TZ='Asia/Shanghai' date +%Y%m%d-%H%M%S)"
          echo "TIME_TAG=${TIME_TAG}" >> "${GITHUB_OUTPUT}"
          for img in openwrt-x86-64-generic-squashfs-combined*.img; do
            gzip -9 -c "${img}" > "${TIME_TAG}_${img}.gz"
            echo "已生成 ${TIME_TAG}_${img}.gz"
          done
          ls -lh

      # ---- 17. 生成 Release 说明 ----------------------------------------------
      # 用户规范：说明写入内核版本、固件版本、纯净插件清单（不展示 kmod）。
      - name: 生成 Release 发布说明
        working-directory: ${{ env.LEDE_DIR }}
        run: |
          bash "${GITHUB_WORKSPACE}/scripts/gen-release-notes.sh" \
            "${GITHUB_WORKSPACE}/${LEDE_DIR}/bin/targets/x86/64" \
            "${GITHUB_WORKSPACE}/${LEDE_DIR}" \
            "${GITHUB_WORKSPACE}/${LEDE_DIR}/bin/targets/x86/64/release-notes.md" \
            "${{ steps.gzip.outputs.TIME_TAG }}" || true
          echo "----- 发布说明预览 -----"
          head -n 60 bin/targets/x86/64/release-notes.md

      # ---- 18. 创建 Release 并上传镜像 ---------------------------------------
      # 用户规范：上传时间前缀命名的 img.gz 到 Releases。
      # 标签形如 x86_64-YYYYMMDD-HHMMSS；若同秒重跑导致标签已存在，
      # 退化为对既有 Release 追加/覆盖上传。
      # 两个关键坑（2026-10-20 实测）：
      #   1) glob：产物名「时间前缀_openwrt-...-squashfs-combined.img.gz」，
      #      combined 前是连字符，不可写 _combined；
      #   2) --repo：本步 working-directory 在 lede/ 源码树内，gh 会按
      #      本地 git remote 推断仓库为 coolsnowwolf/lede 导致 403，
      #      必须显式 --repo "${GITHUB_REPOSITORY}"。
      - name: 创建 Release 并上传镜像
        working-directory: ${{ env.LEDE_DIR }}/bin/targets/x86/64
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="x86_64-${{ steps.gzip.outputs.TIME_TAG }}"
          TITLE="LEDE X86_64 ${{ steps.gzip.outputs.TIME_TAG }}"
          # 先校验产物存在（fail fast，避免 glob 静默不匹配）
          ls -lh *combined*.img.gz
          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_REF_NAME}" \
            --title "${TITLE}" --notes-file release-notes.md \
            *combined*.img.gz \
          || gh release upload "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            *combined*.img.gz --clobber
          echo "Release 发布完成：${TAG} -> ${GITHUB_REPOSITORY}"

      # ---- 19. 失败日志收集（仅当前面步骤失败时执行） -------------------------
      # 用户规范：失败只上传 ERROR 失败日志。
      # 注意：此步骤【不设 working-directory】——早期步骤（依赖安装/克隆源码）
      # 失败时 lede/ 目录尚未生成，写死工作目录会导致 bash 无法启动、
      # 收集步骤自身报错，反而掩盖真实失败原因。脚本内部自行处理源码树缺失。
      - name: 收集失败日志（ERROR 日志）
        if: failure()
        run: |
          bash "${GITHUB_WORKSPACE}/scripts/collect-errors.sh" \
            "${GITHUB_WORKSPACE}/${LEDE_DIR}" \
            "${GITHUB_WORKSPACE}/${LEDE_DIR}/build.log" \
            "${GITHUB_WORKSPACE}/error-logs" || true
          echo "失败日志收集完成（即使收集脚本本身异常也不阻断上传）"

      # ---- 20. 上传失败日志工件（仅失败时） ----------------------------------
      # 路径必须与 collect-errors.sh 的输出目录一致（工作区根 error-logs）；
      # include-hidden-files: true 确保 .config 副本一并上传。
      - name: 上传失败日志工件
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-logs-run${{ github.run_number }}
          path: ${{ github.workspace }}/error-logs
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
